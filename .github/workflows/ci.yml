name: Python learning checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify dependency health
        run: python -m pip check

      - name: Compile tracked exercises
        run: python -m compileall -q Proyecto_Ucamp Retos_M2 Retos_M3 Retos_M4

      - name: Run offline Semana 15 tests
        run: python -m unittest discover -s Retos_M4/Semana15/tests -v

      - name: Run offline Pokédex tests
        run: python -m unittest discover -s Proyecto_Ucamp/Proyecto_M4_Pokedex/tests -v
