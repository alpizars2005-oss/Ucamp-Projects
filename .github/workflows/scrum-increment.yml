name: Mochi Monchi increment checks

on:
  push:
    branches: [main]
    paths:
      - 'Retos_M5/Semana4_SCRUM/**'
      - '.github/workflows/scrum-increment.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Retos_M5/Semana4_SCRUM/**'
      - '.github/workflows/scrum-increment.yml'

permissions:
  contents: read

concurrency:
  group: mochi-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  SPRINT: Retos_M5/Semana4_SCRUM

jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check syntax and run offline logic/API tests
        run: |
          python -m compileall -q "$SPRINT"
          node --check "$SPRINT/app/app.js"
          python -m unittest discover -s "$SPRINT/tests" -v
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install isolated browser verification tools
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: Verify native browser behavior and refresh test evidence
        run: |
          python -m unittest discover -s "$SPRINT/tests" -v 2>&1 | tee "$SPRINT/evidencias/pruebas.txt"
          python "$SPRINT/tools/verify_browser.py"
      - name: Preserve evidence without modifying the repository
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mochi-monchi-browser-evidence
          path: |
            Retos_M5/Semana4_SCRUM/evidencias/*.png
            Retos_M5/Semana4_SCRUM/evidencias/pruebas.txt
            Retos_M5/Semana4_SCRUM/evidencias/verificacion_navegador.json
          retention-days: 7
          if-no-files-found: error
