name: Build and publish UCAMP Sprint 1

on:
  push:
    branches: [main]
    paths:
      - '.github/ucamp-s4-publication.part*'
      - '.github/ucamp_s4_unpack.py'
      - '.github/workflows/scrum-increment.yml'

permissions:
  contents: write

concurrency:
  group: ucamp-sprint-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPRINT: Retos_M5/Semana4_SCRUM
    steps:
      - name: Check out authorized repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify and unpack the prepared project
        run: python .github/ucamp_s4_unpack.py
      - name: Run 44 logic and HTTP checks
        run: |
          mkdir -p "$SPRINT/evidencias"
          python -m unittest discover -s "$SPRINT/tests" -v 2>&1 | tee "$SPRINT/evidencias/pruebas.txt"
          python -m compileall -q "$SPRINT"
          node --check "$SPRINT/app/app.js"
      - name: Install document and browser verification tools
        run: |
          python -m pip install 'python-docx==1.2.0' 'Pillow>=10,<13' 'pypdf==5.9.0' 'playwright==1.57.0'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
          python -m playwright install --with-deps chromium
      - name: Verify native browser flow and capture evidence
        run: python "$SPRINT/tools/verify_browser.py"
      - name: Generate both templates and consolidated PDF
        run: |
          python "$SPRINT/tools/build_documents.py" --pdf
          python "$SPRINT/tools/integrate_repository.py"
      - name: Preserve generated submission artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mochi-monchi-sprint1
          path: Retos_M5/Semana4_SCRUM/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
      - name: Publish only the verified project and indexes
        run: |
          rm .github/ucamp-s4-publication.part{0,1,2,3,4,5,6,7}
          rm .github/ucamp_s4_unpack.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$SPRINT" README.md Retos_M5/README.md PLAN.md
          git add -u -- .github/ucamp-s4-publication.part* .github/ucamp_s4_unpack.py
          if ! git diff --cached --quiet; then
            git commit -m 'feat(scrum): publish tested Mochi Monchi increment and completed templates'
            git push origin HEAD:main
          fi
