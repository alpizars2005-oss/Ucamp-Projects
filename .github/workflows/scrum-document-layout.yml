name: Finalize UCAMP document layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scrum-document-layout.yml'

permissions:
  contents: write

jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SPRINT: Retos_M5/Semana4_SCRUM
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install document tooling
        run: |
          python -m pip install 'python-docx==1.2.0' 'Pillow>=10,<13' 'pypdf==5.9.0'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
      - name: Repair header insets and regenerate delivery
        run: |
          python "$SPRINT/tools/fix_template_headers.py"
          python "$SPRINT/tools/build_documents.py" --pdf
          python "$SPRINT/tools/integrate_repository.py"
      - name: Preserve the final delivery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mochi-monchi-final-delivery
          path: Retos_M5/Semana4_SCRUM/
          include-hidden-files: true
          retention-days: 7
      - name: Publish corrected documents without changing application code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$SPRINT/tools/templates" "$SPRINT/documentos" "$SPRINT/evidencias/manifest_fuentes.json"
          if ! git diff --cached --quiet; then
            git commit -m 'docs(scrum): correct template header clipping and refresh final PDFs'
            git push origin HEAD:main
          fi
