<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1710" viewBox="0 0 2000 1710" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">Mochi Monchi · Fundamentación y Contexto · UCAMP Semana 1</title><desc id="svg-desc">Resumen visual del emprendimiento con seis secciones, datos verificados y fuentes.</desc><rect x="0" y="0" width="2000" height="1710" fill="#0D1117"/><rect x="60" y="55" width="1880" height="215" rx="22" fill="#181E27" stroke="#343B46" stroke-width="2"/><text x="94" y="112" fill="#FF9B63" font-size="24" font-weight="700" font-family="Noto Sans,Arial,sans-serif">UCAMP  /  APRENDIENDO A EMPRENDER  /  MÓDULO 1 · SEMANA 1</text><text x="94" y="190" fill="#F0F3F6" font-size="70" font-weight="700" font-family="Noto Sans,Arial,sans-serif">MOCHI MONCHI</text><text x="97" y="234" fill="#B8C7E0" font-size="28" font-weight="400" font-family="Noto Sans,Arial,sans-serif">De la conversación digital a un pedido que sí podemos preparar</text><rect x="1500" y="93" width="385" height="85" rx="14" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="1525" y="127" fill="#FF9B63" font-size="19" font-weight="700" font-family="Noto Sans,Arial,sans-serif">PROPUESTA ACADÉMICA</text><text x="1525" y="154" fill="#8B949E" font-size="18" font-weight="400" font-family="Noto Sans,Arial,sans-serif">En validación comercial</text><g id="seccion-01"><rect x="60" y="310" width="600" height="570" rx="20" fill="#181E27" stroke="#343B46" stroke-width="2"/><text x="85" y="350" fill="#FF9B63" font-size="21" font-weight="700" font-family="Noto Sans,Arial,sans-serif">01</text><text x="85" y="398" fill="#F0F3F6" font-size="34" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Introducción</text><text x="85" y="435" fill="#8B949E" font-size="19" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Por qué quiero desarrollar Mochi Monchi</text><rect x="84" y="480" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="102" y="511" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Motivación</text><text x="102" y="540" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Aplicar tecnología a</text><text x="102" y="560" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">problemas reales de negocios</text><text x="102" y="580" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">pequeños.</text><rect x="368" y="480" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="386" y="511" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Emprendimiento</text><text x="386" y="540" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Alimentos con atención</text><text x="386" y="560" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">cercana y procesos</text><text x="386" y="580" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">digitales.</text><rect x="84" y="633" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="102" y="664" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Valor</text><text x="102" y="693" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Un pedido, una receta y</text><text x="102" y="713" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">existencias verificables.</text><rect x="368" y="633" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="386" y="664" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Antecedente</text><text x="386" y="693" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Prototipo académico local,</text><text x="386" y="713" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">sin ventas documentadas.</text><rect x="84" y="812" width="552" height="48" rx="10" fill="#343B46"/><text x="101" y="835" fill="#F0F3F6" font-size="16" font-weight="700" font-family="Noto Sans,Arial,sans-serif">El objetivo es mejorar la atención y la organización.</text></g><g id="seccion-02"><rect x="700" y="310" width="600" height="570" rx="20" fill="#181E27" stroke="#343B46" stroke-width="2"/><text x="725" y="350" fill="#FF9B63" font-size="21" font-weight="700" font-family="Noto Sans,Arial,sans-serif">02</text><text x="725" y="398" fill="#F0F3F6" font-size="34" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Problema</text><text x="725" y="435" fill="#8B949E" font-size="19" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Atención digital y control interno separados</text><rect x="724" y="480" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="742" y="511" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Duplicación</text><text x="742" y="540" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Un pedido puede capturarse</text><text x="742" y="560" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">varias veces.</text><rect x="1008" y="480" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="1026" y="511" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Inventario</text><text x="1026" y="540" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Se desconoce si queda stock</text><text x="1026" y="560" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">suficiente.</text><rect x="724" y="633" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="742" y="664" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Atención</text><text x="742" y="693" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Es posible ofrecer productos</text><text x="742" y="713" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">no disponibles.</text><rect x="1008" y="633" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="1026" y="664" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Necesidad</text><text x="1026" y="693" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Conectar consulta, pedido,</text><text x="1026" y="713" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">receta e inventario.</text><rect x="724" y="812" width="552" height="48" rx="10" fill="#343B46"/><text x="741" y="835" fill="#F0F3F6" font-size="16" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Necesidad por validar; aún sin mediciones reales.</text></g><g id="seccion-03"><rect x="1340" y="310" width="600" height="570" rx="20" fill="#181E27" stroke="#343B46" stroke-width="2"/><text x="1365" y="350" fill="#FF9B63" font-size="21" font-weight="700" font-family="Noto Sans,Arial,sans-serif">03</text><text x="1365" y="398" fill="#F0F3F6" font-size="34" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Cliente 2.0</text><text x="1365" y="435" fill="#8B949E" font-size="19" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Comprador conectado, informado y participativo</text><rect x="1364" y="480" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="1382" y="511" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Descubre</text><text x="1382" y="540" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Ve productos y novedades en</text><text x="1382" y="560" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Instagram.</text><rect x="1648" y="480" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="1666" y="511" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Consulta</text><text x="1666" y="540" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Pregunta precios,</text><text x="1666" y="560" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">ingredientes y</text><text x="1666" y="580" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">disponibilidad.</text><rect x="1364" y="633" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="1382" y="664" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Decide</text><text x="1382" y="693" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Espera información clara y</text><text x="1382" y="713" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">oportuna.</text><rect x="1648" y="633" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="1666" y="664" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Opina</text><text x="1666" y="693" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Comparte dudas y comentarios</text><text x="1666" y="713" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">posteriores.</text><rect x="1364" y="812" width="552" height="48" rx="10" fill="#343B46"/><text x="1381" y="835" fill="#F0F3F6" font-size="16" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Consideramos tanto al comprador como al operador.</text></g><g id="seccion-04"><rect x="60" y="920" width="600" height="570" rx="20" fill="#181E27" stroke="#343B46" stroke-width="2"/><text x="85" y="960" fill="#FF9B63" font-size="21" font-weight="700" font-family="Noto Sans,Arial,sans-serif">04</text><text x="85" y="1008" fill="#F0F3F6" font-size="34" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Ecosistema digital</text><text x="85" y="1045" fill="#8B949E" font-size="19" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Sector de alimentos y bebidas en México</text><rect x="84" y="1090" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="102" y="1121" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">INEGI · 86.1 %</text><text x="102" y="1150" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Población de 6+ que usó</text><text x="102" y="1170" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">internet en 2025.</text><rect x="368" y="1090" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="386" y="1121" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">AMVO · 71 %</text><text x="386" y="1150" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Compradores estudiados que</text><text x="386" y="1170" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">combinan canales.</text><rect x="84" y="1243" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="102" y="1274" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Tendencia</text><text x="102" y="1303" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Omnicanalidad: descubrir,</text><text x="102" y="1323" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">preguntar y comprar.</text><rect x="368" y="1243" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="386" y="1274" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Complemento</text><text x="386" y="1303" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Automatización de pedidos e</text><text x="386" y="1323" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">inventario.</text><rect x="84" y="1422" width="552" height="48" rx="10" fill="#343B46"/><text x="101" y="1445" fill="#F0F3F6" font-size="16" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Cifras nacionales ≠ demanda específica de Mochi Monchi.</text></g><g id="seccion-05"><rect x="700" y="920" width="600" height="570" rx="20" fill="#181E27" stroke="#343B46" stroke-width="2"/><text x="725" y="960" fill="#FF9B63" font-size="21" font-weight="700" font-family="Noto Sans,Arial,sans-serif">05</text><text x="725" y="1008" fill="#F0F3F6" font-size="34" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Redes sociales</text><text x="725" y="1045" fill="#8B949E" font-size="19" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Empezar con un canal principal</text><rect x="724" y="1090" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="742" y="1121" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Instagram</text><text x="742" y="1150" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Fotografías, historias,</text><text x="742" y="1170" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">reels y mensajes.</text><rect x="1008" y="1090" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="1026" y="1121" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">WhatsApp Business</text><text x="1026" y="1150" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Atención y confirmación</text><text x="1026" y="1170" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">manual.</text><rect x="724" y="1243" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="742" y="1274" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">TikTok</text><text x="742" y="1303" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Videos de descubrimiento a</text><text x="742" y="1323" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">evaluar después.</text><rect x="1008" y="1243" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="1026" y="1274" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Decisión</text><text x="1026" y="1303" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">El formato visual favorece</text><text x="1026" y="1323" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">mostrar alimentos.</text><rect x="724" y="1422" width="552" height="48" rx="10" fill="#343B46"/><text x="741" y="1445" fill="#F0F3F6" font-size="16" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Validaremos preguntas, consultas y preferencias.</text></g><g id="seccion-06"><rect x="1340" y="920" width="600" height="570" rx="20" fill="#181E27" stroke="#343B46" stroke-width="2"/><text x="1365" y="960" fill="#FF9B63" font-size="21" font-weight="700" font-family="Noto Sans,Arial,sans-serif">06</text><text x="1365" y="1008" fill="#F0F3F6" font-size="34" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Gestión y validación</text><text x="1365" y="1045" fill="#8B949E" font-size="19" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Documentar decisiones y obtener evidencia</text><rect x="1364" y="1090" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="1382" y="1121" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Miro</text><text x="1382" y="1150" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Tablero visual del problema</text><text x="1382" y="1170" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">y del sector.</text><rect x="1648" y="1090" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="1666" y="1121" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">GitHub</text><text x="1666" y="1150" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Documentación y continuidad</text><text x="1666" y="1170" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">del proyecto.</text><rect x="1364" y="1243" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="1382" y="1274" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Prototipo</text><text x="1382" y="1303" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Simulación local de pedidos</text><text x="1382" y="1323" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">e inventario.</text><rect x="1648" y="1243" width="267" height="140" rx="12" fill="#0D1117" stroke="#343B46" stroke-width="2"/><text x="1666" y="1274" fill="#FF9B63" font-size="18" font-weight="700" font-family="Noto Sans,Arial,sans-serif">Pendiente</text><text x="1666" y="1303" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Entrevistas, demanda y</text><text x="1666" y="1323" fill="#B8C7E0" font-size="16" font-weight="400" font-family="Noto Sans,Arial,sans-serif">pruebas comerciales.</text><rect x="1364" y="1422" width="552" height="48" rx="10" fill="#343B46"/><text x="1381" y="1445" fill="#F0F3F6" font-size="16" font-weight="700" font-family="Noto Sans,Arial,sans-serif">No hay integración automática con redes ni ventas reales.</text></g><rect x="60" y="1530" width="1880" height="132" rx="20" fill="#181E27" stroke="#343B46" stroke-width="2"/><text x="90" y="1569" fill="#FF9B63" font-size="23" font-weight="700" font-family="Noto Sans,Arial,sans-serif">FUENTES Y ESTADO</text><a href="https://www.inegi.org.mx/contenidos/saladeprensa/boletines/2026/endutih/ENDUTIH_25.pdf"><text x="90" y="1605" fill="#B8C7E0" font-size="19" font-weight="400" font-family="Noto Sans,Arial,sans-serif">INEGI · ENDUTIH 2025</text></a><a href="https://blog.amvo.org.mx/blog/10-hallazgos-clave-de-los-estudios-de-amvo-del-2026"><text x="485" y="1605" fill="#B8C7E0" font-size="19" font-weight="400" font-family="Noto Sans,Arial,sans-serif">AMVO · Hallazgos 2026</text></a><a href="https://miro.com/app/board/uXjVEcssfMI=/"><text x="910" y="1605" fill="#FFB07A" font-size="19" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Abrir tablero original en Miro</text></a><text x="90" y="1640" fill="#8B949E" font-size="17" font-weight="400" font-family="Noto Sans,Arial,sans-serif">Respaldo vectorial; no es una captura del tablero. Se debe validar el emprendimiento con usuarios reales.</text></svg>